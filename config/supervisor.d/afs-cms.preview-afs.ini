[program: afs-cms.preview-afs]
command=java -XX:+UseG1GC -Xss512K -XX:+UseCompressedOops -XX:+PrintGCDetails -verbose:gc -Xloggc:/home/ecs-user/work/log/afs-cms/gc.log -Xmx2000m -Xms2000m -jar afs-cms.jar --spring.profiles.active=preview-afs    ; 运行程序的命令
directory=/home/ecs-user/work/deploy/afs-cms   ; 命令执行的目录
autorestart=true   ; 程序意外退出是否自动重启
autostart=true   ; 是否自动启动
redirect_stderr=true          ; 配置stderr 日志，如果有stderr错误会保存在该日志文件中
loglevel=debug
stderr_logfile=/home/ecs-user/work/log/afs-cms/afs-cms-sup.err.log   ; supervisor错误日志文件
stdout_logfile=/home/ecs-user/work/log/afs-cms/afs-cms-sup.log   ;supervisor输出日志文件
environment=ASPNETCORE_ENVIRONMENT=Production   ; 进程环境变量
user=ecs-user   ; 进程执行的用户身份
stopsignal=INT
startsecs=1   ; 自动重启间隔